{% extends 'base.html' %}

{% block title %}{{ event.title }} — EventFlow{% endblock %}

{% block content %}
<h1>{{ event.title }}</h1>
<p>{{ event.description }}</p>
<p>{{ event.category }}</p>
<p>{{ event.location }}</p>
<p>{{ event.status }}</p>
<a href="{% url 'event_update' event.id %}">Редактировать</a>
<a href="{% url 'event_delete' event.id %}">Удалить</a>
<a href="{% url 'index' %}">Назад к списку событий</a>
{% endblock %}
