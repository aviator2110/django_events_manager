{% extends 'base.html' %}

{% block title %}Редактирование: {{ event.title }} — EventFlow{% endblock %}

{% block content %}
<h1>Редактирование события</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить</button>
</form>
<a href="{% url 'index' %}">Назад к списку событий</a>
<a href="{% url 'event_detail' event.id %}">Назад к событию</a>
{% endblock %}
